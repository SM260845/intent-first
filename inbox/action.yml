name: Intent Inbox
description: Gates new .intent/open/ intents on a human approval, opens an issue for each, and merges the first PR whose claimed intent's checks pass.
author: ao3575911
branding:
  icon: inbox
  color: green
inputs:
  mode:
    description: "`intake` (on pull_request and pull_request_review), `open` (on push to the default branch) or `ship` (on workflow_run, completed)."
    required: true
  token:
    description: Token for the GitHub API.
    default: ${{ github.token }}
  assignees:
    description: Optional comma-separated logins to assign each new intent issue to, e.g. copilot-swe-agent[bot]. Needs a user token.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INBOX_ASSIGNEES: ${{ inputs.assignees }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MODE: ${{ inputs.mode }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.event.after }}
        RUN_ID: ${{ github.event.workflow_run.id }}
      run: python3 "$GITHUB_ACTION_PATH/../scripts/intent_inbox.py" "$MODE"
