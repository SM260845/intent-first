name: intent-inbox

# Intent Inbox. A maintainer approves an intent into .intent/open/; anyone opens
# a PR with "Claims: <id>". proof-carrying-pr runs the intent's check: lines on
# that PR (untrusted, read-only token). The jobs below are the trusted half: they
# run with code from the default branch only and never check out the PR. `claims`
# lists the passing claims (from the run that just finished, or every open claim
# on the sweep), and `ship` merges each one at the SHA that passed, one job per
# intent at a time. Intent files never move; a closed issue means not claimable.
on:
  push:
    branches: [main]
    paths: [".intent/open/**"]
  workflow_run:
    workflows: [proof-carrying-pr]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"   # sweep: retry passing claims that weren't merged
  workflow_dispatch:

permissions: {}

jobs:
  open:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./inbox
        with:
          mode: open
          # assignees: copilot-swe-agent[bot]   # optional; needs a user token in token: (see README)

  claims:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read}
    outputs: {claims: "${{ steps.c.outputs.claims }}"}
    steps:
      - uses: actions/checkout@v5   # the default branch
        with: {persist-credentials: false}
      - id: c
        uses: ./inbox
        with: {mode: claims, workflow: proof-carrying-pr.yml}

  ship:
    needs: claims
    if: needs.claims.outputs.claims != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {include: "${{ fromJSON(needs.claims.outputs.claims) }}"}
    concurrency: {group: "intent-inbox-ship-${{ matrix.intent }}", cancel-in-progress: false}
    permissions: {contents: write, pull-requests: write, issues: write, actions: read}
    steps:
      - uses: actions/checkout@v5   # the default branch; the PR's code is never checked out here
        with: {persist-credentials: false}
      - uses: ./inbox
        with: {mode: ship, run-id: "${{ matrix.run }}", protect: "action.yml,inbox/,scripts/"}
