name: intent-inbox

# Intent Inbox. A human adds .intent/open/<id>.md; anyone opens a PR with
# "Claims: <id>". proof-carrying-pr runs the intent's check: lines on that PR
# (untrusted, read-only token). The ship job below is the trusted half: it runs
# on workflow_run with code from the default branch only, never checks out the
# PR, squash-merges the first passing claim at the SHA that passed, and closes
# the issue with the `shipped` label. Intent files never move. New intents are
# gated at intake instead (intent-intake.yml).
on:
  push:
    branches: [main]
    paths: [".intent/open/**"]
  workflow_run:
    workflows: [proof-carrying-pr]
    types: [completed]

permissions: {}

jobs:
  open:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./inbox
        with:
          mode: open
          # assignees: copilot-swe-agent[bot]   # optional; needs a user token in token: (see README)

  ship:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: {group: intent-inbox-ship, cancel-in-progress: false}
    permissions: {contents: write, pull-requests: write, issues: write, actions: read}
    steps:
      - uses: actions/checkout@v5   # the default branch; the PR's code is never checked out here
        with: {persist-credentials: false}
      - uses: ./inbox
        with: {mode: ship}
