name: proof-carrying-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:  # intent-inbox re-runs CI on a claim branch after it commits the intent move

permissions:
  contents: read

jobs:
  intent-check:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx run ruff check .
      - run: python3 scripts/test_intent_check.py
      - run: python3 scripts/test_proof_check.py
      - run: python3 scripts/test_intent_inbox.py
      - run: python3 scripts/test_git_why.py
