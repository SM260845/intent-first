name: intent-intake

# Anyone, human or agent, may propose an intent by PR into .intent/open/. This
# check fails any PR that changes .intent/open/ until an owner, member or
# collaborator other than the PR author approves its latest commit, and re-runs
# when a review is submitted or dismissed. It reads PR metadata through the API
# only, and runs the checker from the PR's base commit, never from the PR.
# Make it a required status check.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  intent-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # the base commit, so a PR can't rewrite the check; consumers pin @v1
        with: {ref: "${{ github.event.pull_request.base.sha }}", persist-credentials: false}
      - uses: ./inbox
        with: {mode: intake}
